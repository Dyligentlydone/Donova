<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: #101418; }
  .clip { position: absolute; inset: 0; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #label { position: absolute; left: 24px; bottom: 24px; font: 600 22px system-ui; color: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="640" data-height="360" data-duration="3" data-fps="30">
  <div class="clip" data-start="0" data-duration="2">
    <video src="clip.mp4" muted data-has-audio="false"></video>
    <div id="label">video clip</div>
  </div>
  <div class="clip" data-start="1.0" data-duration="2" style="background:#203040">
    <div id="label">music bed scene</div>
    <audio src="music.aac" data-audio-offset="0.5" data-volume="0.8"></audio>
  </div>
</div>
</body>
</html>
