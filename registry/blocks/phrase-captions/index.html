<!-- phrase-captions block: styles for generated phrase captions.
     Generate with: donova captions --transcript t.json --cuts cuts.json --mode phrase -->
<div data-composition-id="phrase-captions" data-width="1080" data-height="1920" data-duration="1">
<style>
  .fc-pcap {
    position: absolute;
    left: 50%;
    bottom: var(--fc-cap-bottom, 12%);
    transform: translateX(-50%);
    font: var(--fc-cap-font, 700 44px/1.25 system-ui, sans-serif);
    color: var(--fc-cap-color, #fff);
    background: var(--fc-cap-bg, rgba(0,0,0,0.55));
    padding: 0.25em 0.6em;
    border-radius: 0.35em;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</div>
